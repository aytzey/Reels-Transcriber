<html class="light" lang="en"><head>

        darkMode: "class",

          extend: {

              "outline-variant": "#dac1b8",

              "secondary": "#645d58",

              "on-error": "#ffffff",
              "inverse-on-surface": "#f2f1ec",
              "surface-container-lowest": "#ffffff",
              "on-tertiary-fixed-variant": "#004f59",

              "on-primary-fixed-variant": "#76320f",
              "on-tertiary": "#ffffff",
              "on-error-container": "#93000a",
              "secondary-container": "#eae1da",
              "surface-container-highest": "#e4e2dd",
              "primary-fixed": "#ffdbcd",
              "on-surface-variant": "#54433c",
              "surface-tint": "#944925",
              "surface": "#fbf9f4",

              "on-secondary-fixed-variant": "#4b4641",

              "on-primary-container": "#ffe1d6",

            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},

<style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .editorial-shadow {
        box-shadow: 0 20px 40px rgba(27, 28, 25, 0.05);
      }
      .ghost-border {
        border: 1px solid rgba(218, 193, 184, 0.2);
      }
      .active-ghost-border {
        border: 1px solid #823b18;
      }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="bg-[#fbf9f4] dark:bg-stone-950 flex justify-between items-center w-full px-8 py-6 max-w-7xl mx-auto top-0 sticky z-50">
<div class="text-2xl font-serif italic text-[#1b1c19] dark:text-[#f5f3ee]">StoryToText</div>
<div class="flex items-center gap-6">
<button class="text-[#1b1c19]/60 dark:text-[#f5f3ee]/60 hover:bg-[#f5f3ee] dark:hover:bg-stone-900 transition-colors p-2 rounded-full">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</div>
</header>
<!-- Main Content: Onboarding Step 2 -->
<main class="flex-grow flex items-center justify-center px-6 py-12 md:py-24">
<div class="max-w-4xl w-full">
<!-- Header Section -->
<div class="text-center mb-16">
<span class="font-label text-xs uppercase tracking-[0.2em] text-primary font-semibold mb-4 block">Onboarding • Stage 02</span>
<h1 class="font-headline text-5xl md:text-6xl text-on-surface leading-tight tracking-tight mb-6">
                    Where do you find <br/><i class="font-serif">your content?</i>
</h1>
<p class="font-body text-secondary text-lg max-w-xl mx-auto leading-relaxed">
                    Select your primary source of inspiration. We'll tailor the transcription engine to match your workflow.
                </p>
</div>
<!-- Bento-style Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Card 1: Single URL -->
<button class="group relative flex flex-col items-start p-8 bg-surface-container-lowest editorial-shadow ghost-border hover:active-ghost-border transition-all duration-300 text-left active:scale-[0.98]">
<div class="bg-primary-fixed p-3 mb-6 transition-colors group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined" data-icon="link">link</span>
</div>
<h3 class="font-headline text-2xl mb-3 text-on-surface">Single URL</h3>
<p class="font-body text-on-surface-variant leading-relaxed">Paste a link from Instagram, TikTok, or YouTube.</p>
</button>
<!-- Card 2: Profile Batch -->
<button class="group relative flex flex-col items-start p-8 bg-surface-container-lowest editorial-shadow ghost-border hover:active-ghost-border transition-all duration-300 text-left active:scale-[0.98]">
<div class="bg-primary-fixed p-3 mb-6 transition-colors group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined" data-icon="library_books">library_books</span>
</div>
<h3 class="font-headline text-2xl mb-3 text-on-surface">Profile Batch</h3>
<p class="font-body text-on-surface-variant leading-relaxed">Transcribe entire profiles or channels.</p>
</button>
<!-- Card 3: File Upload -->
<button class="group relative flex flex-col items-start p-8 bg-surface-container-lowest editorial-shadow ghost-border hover:active-ghost-border transition-all duration-300 text-left active:scale-[0.98]">
<div class="bg-primary-fixed p-3 mb-6 transition-colors group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined" data-icon="cloud_upload">cloud_upload</span>
</div>
<h3 class="font-headline text-2xl mb-3 text-on-surface">File Upload</h3>
<p class="font-body text-on-surface-variant leading-relaxed">Upload your own audio and video files.</p>
</button>
<!-- Card 4: API & Agent -->
<button class="group relative flex flex-col items-start p-8 bg-surface-container-lowest editorial-shadow ghost-border hover:active-ghost-border transition-all duration-300 text-left active:scale-[0.98]">
<div class="bg-primary-fixed p-3 mb-6 transition-colors group-hover:bg-primary-container group-hover:text-on-primary-container">
<span class="material-symbols-outlined" data-icon="integration_instructions">integration_instructions</span>
</div>
<h3 class="font-headline text-2xl mb-3 text-on-surface">API &amp; Agent</h3>
<p class="font-body text-on-surface-variant leading-relaxed">Integrate into your development environment.</p>
</button>
</div>
<!-- Action Area -->
<div class="mt-16 flex flex-col items-center gap-6">
<button class="px-12 py-4 bg-gradient-to-br from-primary to-primary-container text-on-primary font-semibold tracking-wide rounded-md editorial-shadow hover:opacity-90 transition-opacity active:scale-95">
                    Continue to Setup
                </button>
<div class="flex items-center gap-4">
<span class="font-label text-[10px] uppercase tracking-widest text-secondary/60">Step 2 of 3</span>
<div class="flex gap-2">
<div class="w-8 h-1 bg-primary-fixed"></div>
<div class="w-12 h-1 bg-primary"></div>
<div class="w-8 h-1 bg-surface-container-highest"></div>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Shell Only - Hidden on desktop) -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-8 pt-4 bg-[#fbf9f4]/85 dark:bg-stone-950/85 backdrop-blur-md shadow-[0_-20px_40px_rgba(27,28,25,0.05)]">
<a class="flex flex-col items-center justify-center text-[#1b1c19] dark:text-[#f5f3ee] opacity-40 px-6 py-2 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined" data-icon="psychology">psychology</span>
<span class="text-[10px] uppercase tracking-widest font-sans mt-1">Intent</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#ffdbcd] dark:bg-[#823b18]/30 text-[#823b18] dark:text-[#ffdbcd] rounded-md px-6 py-2" href="#">
<span class="material-symbols-outlined" data-icon="cloud_upload">cloud_upload</span>
<span class="text-[10px] uppercase tracking-widest font-sans mt-1">Source</span>
</a>
<a class="flex flex-col items-center justify-center text-[#1b1c19] dark:text-[#f5f3ee] opacity-40 px-6 py-2 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="text-[10px] uppercase tracking-widest font-sans mt-1">Setup</span>
</a>
</nav>
<!-- Decorative Background Elements -->
<div class="fixed top-0 right-0 -z-10 w-1/3 h-screen opacity-5 pointer-events-none">

</div>

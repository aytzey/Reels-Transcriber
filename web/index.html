<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>StoryToText</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#fbf9f4",
              background: "#fbf9f4",
              "surface-bright": "#fbf9f4",
              "surface-dim": "#dcdad5",
              "surface-variant": "#e4e2dd",
              "surface-container-lowest": "#ffffff",
              "surface-container-low": "#f5f3ee",
              "surface-container": "#f0eee9",
              "surface-container-high": "#eae8e3",
              "surface-container-highest": "#e4e2dd",
              primary: "#823b18",
              "primary-container": "#a0522d",
              "primary-fixed": "#ffdbcd",
              "primary-fixed-dim": "#ffb596",
              "on-primary": "#ffffff",
              "on-primary-fixed": "#360f00",
              "on-primary-fixed-variant": "#76320f",
              secondary: "#645d58",
              "secondary-container": "#eae1da",
              "secondary-fixed": "#eae1da",
              "secondary-fixed-dim": "#cec5bf",
              "on-secondary": "#ffffff",
              tertiary: "#005863",
              "tertiary-container": "#007280",
              "tertiary-fixed": "#9defff",
              "tertiary-fixed-dim": "#7fd3e3",
              "on-surface": "#1b1c19",
              "on-surface-variant": "#54433c",
              outline: "#87736b",
              "outline-variant": "#dac1b8",
              error: "#ba1a1a",
              "error-container": "#ffdad6",
              "on-error": "#ffffff",
              "on-error-container": "#93000a",
            },
            fontFamily: {
              headline: ["Newsreader", "serif"],
              body: ["Plus Jakarta Sans", "sans-serif"],
              label: ["Plus Jakarta Sans", "sans-serif"],
              instrument: ["Instrument Serif", "serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            boxShadow: {
              editorial: "0 20px 40px rgba(27, 28, 25, 0.05)",
            },
            borderRadius: {
              xl: "0.5rem",
            },
          },
        },
      };
    </script>
    <link href="/assets/styles.css" rel="stylesheet" />
  </head>
  <body class="bg-surface text-on-surface font-body selection:bg-primary-fixed selection:text-on-primary-fixed-variant">
    <div id="app"></div>
    <div id="toast-root"></div>
    <script src="/assets/app.js"></script>
  </body>
</html>

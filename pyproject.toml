[project]
name = "reels-transcriber"
version = "1.0.0"
description = "StoryToText: editorial transcription workspace for YouTube, TikTok, Instagram Reels, uploads, and API-driven transcript jobs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Aytug Berk Sezer", email = "aytugsezer@gmail.com" },
]
keywords = [
    "whisper", "speech-to-text", "transcription", "instagram", "tiktok",
    "gpu", "mps", "apple-silicon", "cuda",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.1",
    "torchaudio>=2.1",
    "transformers>=4.40",
    "accelerate>=0.26",
    "optimum>=1.16",
    "playwright>=1.40",
    "requests",
    "curl_cffi>=0.6",
    "yt-dlp>=2024.0.0",
    "youtube-transcript-api>=1.2.4",
]

[project.urls]
Repository = "https://github.com/aytzey/reels-transcriber"

[project.scripts]
reels-transcriber = "app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"
